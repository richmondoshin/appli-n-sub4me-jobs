# Shared job index (M7.1). This file runs in the PUBLIC repo richmondoshin/appli-n-sub4me-jobs as
# .github/workflows/daily-index.yml. It is kept here as the source; it does not run in this private repo.
name: Daily job index

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
    - cron: "43 13 * * *"  # and 13:43 UTC: GitHub can delay or skip a scheduled run (25 Nov: 05:17 ran at 15:44)
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write           # to commit design-uk.json

concurrency:
  group: daily-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python index/build_index.py --out design-uk.json
      - name: Commit if the list changed
        run: |
          git config user.name "appli-n-sub4me-index"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-uk.json
          git diff --cached --quiet || git commit -m "Daily job index $(date -u +%F)"
          git push
